<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decomposição</title>

    <link rel="stylesheet" href="styledecomposicao.css">
</head>

<body>

    <!-- JOGO DE DECOMPOSIÇÃO -->
    <main class="jogo-decomposicao">

        <!-- CABEÇALHO -->
        <header class="cabecalho-jogo">
            <h1>JOGO</h1>
            <h2>DECOMPOSIÇÃO</h2>
        </header>

        <!-- ÁREA DO JOGO -->
        <section class="area-jogo">

            <!-- NÚMERO ESCOLHIDO PELA PROFESSORA -->
            <div class="numero-central">
                <input
                    type="number"
                    id="numero"
                    min="0"
                    max="9999999"
                    step="1"
                    placeholder="?"
                    autocomplete="off"
                    aria-label="Número para decompor"
                >
            </div>

            <!-- DECOMPOSIÇÃO NUMÉRICA -->
            <div class="decomposicao">

                <!-- UNIDADE DE MILHÃO -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Unidade de milhão"
                >

                <span class="sinal">+</span>

                <!-- CENTENA DE MILHAR -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Centena de milhar"
                >

                <span class="sinal">+</span>

                <!-- DEZENA DE MILHAR -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Dezena de milhar"
                >

                <span class="sinal">+</span>

                <!-- UNIDADE DE MILHAR -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Unidade de milhar"
                >

                <span class="sinal">+</span>

                <!-- CENTENA -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Centena"
                >

                <span class="sinal">+</span>

                <!-- DEZENA -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Dezena"
                >

                <span class="sinal">+</span>

                <!-- UNIDADE -->
                <input
                    type="number"
                    class="resposta"
                    placeholder="?"
                    step="1"
                    autocomplete="off"
                    aria-label="Unidade"
                >

            </div>

        </section>

        <!-- BOTÃO VERIFICAR -->
        <button id="verificar" type="button">
            VERIFICAR
        </button>

        <!-- RESULTADO -->
        <p id="resultado" aria-live="polite"></p>

        <!-- LOCAL -->
        <p class="local">Praça do Baobá</p>

    </main>

    <!-- JAVASCRIPT -->
    <script src="decomposicao.js"></script>

</body>

</html>
